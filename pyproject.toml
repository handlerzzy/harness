[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-core-py"
version = "0.80.10"
description = "A faithful Python port of @earendil-works/pi-agent-core"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Wesley Zhang" }]
keywords = ["ai", "agent", "llm", "runtime", "streaming"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pathspec>=0.12,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
]

[project.urls]
Source = "https://github.com/wesleyzhangwq/pi-agent-core-py"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/agent"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"src/pi_agent_core/harness/env/nodejs.py" = ["ASYNC240"]
"tests/test_execution_env.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pi_agent_core"]
