name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests examples
      - name: Ruff lint
        run: ruff check src tests examples
      - name: Strict typing
        run: mypy src
      - name: Tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/aster-harness-wheel-test
          /tmp/aster-harness-wheel-test/bin/pip install dist/*.whl
          /tmp/aster-harness-wheel-test/bin/python -c "from importlib.metadata import version; import aster_harness; assert aster_harness.__version__ == version('aster-harness') == '0.1.0'"
          /tmp/aster-harness-wheel-test/bin/python examples/chat.py --help
