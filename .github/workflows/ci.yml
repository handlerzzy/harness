name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Strict typing
        run: mypy src
      - name: Tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/pi-agent-wheel-test
          /tmp/pi-agent-wheel-test/bin/pip install dist/*.whl
          /tmp/pi-agent-wheel-test/bin/python -c "import pi_agent_core; assert pi_agent_core.__version__ == '0.80.10'"
